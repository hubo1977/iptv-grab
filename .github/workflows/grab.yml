name: grab-live

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install --quiet playwright requests
          python -m playwright install --with-deps chromium

      - name: 抓取
        run: python scripts/grab.py

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.json
          git diff --cached --quiet || git commit -m "update result.json $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push   
